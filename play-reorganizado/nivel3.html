<!DOCTYPE html>
<!--
======================================================
ARCHIVO: nivel3.html
UBICACION: play-reorganizado/
VERSION: 1.1 - Codigo seccionado
ULTIMA ACTUALIZACION: 2026-04-25 15:50

PROPOSITO:
Vista HTML del videojuego SENATIC, separada de estilos y logica JS
para facilitar mantenimiento sin alterar el flujo jugable.

======================================================
REGLAS PARA PRODUCCION:
---
- Esta cabecera documenta cambios internos del proyecto
- Mantener el historial actualizado con fecha y hora

======================================================
HISTORIAL DE CAMBIOS:
---
[1.1] - 2026-04-25 15:50
- Se agregan bloques de lectura para separar UI, escena, fondo 3D, plataformas, meta, jugador y camara.

[1.0] - 2026-04-25 15:41
- Copia reorganizada con HTML, CSS y JS separados.
======================================================
-->
<html lang="es">
<head>
    <meta charset="UTF-8">
    <link href="img/teclado-espac3 b1ol-numeros.jpg" rel="icon">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>JUEGO SENATIC - NIVEL 3</title>
    <script src="https://aframe.io/releases/1.4.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/c-frame/aframe-physics-system@v4.2.2/dist/aframe-physics-system.min.js"></script>
    <link rel="stylesheet" href="css/nivel3.css">
    <script src="js/nivel3.js"></script>
</head>
<body>

    <!-- ======================================================
    BLOQUE 1: CONTROLES MOVILES
    Se muestran solo en dispositivos tactiles y simulan las teclas del jugador.
    ====================================================== -->
    <div class="controles-movil">
        <div class="d-pad">
            <div></div><div id="m-up" class="d-btn">▲</div><div></div>
            <div id="m-left" class="d-btn">◀</div><div id="m-down" class="d-btn">▼</div><div id="m-right" class="d-btn">▶</div>
        </div>
        <div id="m-jump" class="btn-salto">SALTO</div>
    </div>

    <!-- ======================================================
    BLOQUE 2: PANTALLA DE INICIO DEL NIVEL
    Presenta la estacion orbital y habilita la partida final.
    ====================================================== -->
    <!-- Pantalla de inicio nivel 3 -->
    <div id="pantalla-inicio" class="overlay">
        <div class="terminal-box">
            <h1 class="level-title">★ NIVEL FINAL ★</h1>
            <h2 class="level-subtitle">ESTACIÓN ORBITAL</h2>
            <p class="level-description">Agente <span id="nombre-agente"></span>: Plataformas pequeñas<br>y algunas en movimiento. ¡Máxima concentración!</p>
            <button class="btn-systec" onclick="iniciarNivel3()">INICIAR NIVEL FINAL</button>
            <br>
            <button class="btn-volver-portal" onclick="irAlIndex()">
                ⬅ VOLVER AL PORTAL
            </button>
        </div>
    </div>

    <!-- ======================================================
    BLOQUE 3: HUD DEL NIVEL
    Muestra piloto, nivel, puntaje y vidas durante la partida.
    ====================================================== -->
    <div id="ui-top">
        ID: <span id="user-display">---</span><br>
        NIVEL: <span class="nivel-valor">3 - FINAL</span><br>
        PTS: <span id="puntos-val">0</span><br>
        <div id="vidas-val">❤️❤️❤️</div>
    </div>

    <!-- ======================================================
    BLOQUE 4: PANTALLA DE RESULTADO
    Reintento o retorno cuando termina la partida.
    ====================================================== -->
    <div id="game-over-screen" class="overlay">
        <div class="terminal-box">
            <h1 id="final-title">TERMINADO</h1>
            <p id="final-score"></p>
            <button class="btn-systec" onclick="location.reload()">REINTENTAR NIVEL FINAL</button>
            <br>
            <button class="btn-ir-inicio" onclick="irAlIndex()">
                ⬅ IR AL INICIO
            </button>
        </div>
    </div>

    <!-- ======================================================
    BLOQUE 5: ESCENA 3D DEL NIVEL 3
    Incluye fondo 3D, luces, plataformas moviles, meta final, jugador y camara.
    ====================================================== -->
    <a-scene background="color: #000a1a" physics="gravity: -18; friction: 0.01;">
        <a-assets>
            <audio id="musica-fondo" src="video/video.mp3" preload="auto"></audio>
            <img id="fondo-nivel-3" src="img/fondo_3.jpg">
        </a-assets>


        <a-sound id="audio-fondo" src="#musica-fondo" loop="true" volume="0.20"></a-sound>

        <!-- ======================================================
        BLOQUE 6: FONDO 3D Y AMBIENTE
        La imagen fondo_3.jpg envuelve al jugador mediante una cupula interna.
        ====================================================== -->
        <!-- Cúpula 3D interna para visualizar fondo_3.jpg alrededor del jugador. -->
        <a-sphere id="cielo-nivel-3" radius="180" material="src: #fondo-nivel-3; shader: flat; side: back" rotation="0 -90 0"></a-sphere>
        <a-stars radius="150" count="10000" color="#aaddff"></a-stars>

        <!-- ======================================================
        BLOQUE 7: LUCES DEL NIVEL
        Refuerzan la lectura del espacio y los objetos en la escena.
        ====================================================== -->
        <!-- Luces frías azules -->
        <a-light type="ambient" intensity="0.4" color="#334466"></a-light>
        <a-light type="directional" intensity="1.5" color="#88ccff" position="-5 20 10"></a-light>
        <a-light type="point" intensity="2" color="#0044ff" position="0 30 -60"></a-light>

        <!-- ======================================================
        BLOQUE 8: PELIGRO PRINCIPAL
        El vacio invisible detecta caidas y resta vidas.
        ====================================================== -->
        <!-- Vacío (fondo invisible, caer = perder vida) -->
        <a-box id="vacio" class="peligro" static-body position="0 -10 -60" width="200" height="1" depth="200" color="#000000" opacity="0"></a-box>

        <!-- ======================================================
        BLOQUE 9: PLATAFORMAS DEL NIVEL
        Ruta jugable con saltos, descansos y plataformas moviles.
        ====================================================== -->
        <!-- ===== PLATAFORMAS NIVEL 3 - ESTACIÓN ESPACIAL ===== -->
        <!-- Base de lanzamiento -->
        <a-box class="suelo" static-body position="0 0 0" width="6" height="0.4" depth="6" color="#223355" material="emissive: #112244; emissiveIntensity: 0.5"></a-box>

        <!-- Escalones iniciales -->
        <a-box class="suelo" static-body position="3 2 -7" width="2.5" height="0.3" depth="2.5" color="#334466"></a-box>
        <a-box class="suelo" static-body position="-3 4 -13" width="2.5" height="0.3" depth="2.5" color="#334466"></a-box>
        <a-box class="suelo" static-body position="4 7 -19" width="2" height="0.3" depth="2" color="#445577"></a-box>

        <!-- Zona con plataformas pequeñas -->
        <a-text value="ZONA DE GRAVEDAD CERO" position="0 12 -25" align="center" color="#88ccff" scale="2.5 2.5 2.5"></a-text>

        <a-box class="suelo" static-body position="0 10 -26" width="4" height="0.3" depth="4" color="#223355" material="emissive: #112233; emissiveIntensity: 0.4"></a-box>

        <!-- Plataformas pequeñas zigzag -->
        <a-box class="suelo" static-body position="-7 12 -32" width="2" height="0.3" depth="2" color="#334466"></a-box>
        <a-box class="suelo" static-body position="7 14 -38" width="2" height="0.3" depth="2" color="#334466"></a-box>
        <a-box class="suelo" static-body position="-6 16 -44" width="2" height="0.3" depth="2" color="#445588"></a-box>
        <a-box class="suelo" static-body position="0 18 -50" width="2" height="0.3" depth="2" color="#445588"></a-box>

        <!-- Plataformas MÓVILES (van de lado a lado) -->
        <a-box class="suelo" plataforma-movil="desde: -8 20 -57; hasta: 8 20 -57; velocidad: 0.015"
               static-body width="3" height="0.3" depth="3" color="#0066aa" material="emissive: #003366; emissiveIntensity: 0.6"></a-box>

        <a-box class="suelo" plataforma-movil="desde: 6 23 -65; hasta: -6 23 -65; velocidad: 0.018"
               static-body width="2.5" height="0.3" depth="2.5" color="#0055bb" material="emissive: #002255; emissiveIntensity: 0.6"></a-box>

        <a-box class="suelo" plataforma-movil="desde: -5 26 -73; hasta: 5 26 -73; velocidad: 0.022"
               static-body width="2" height="0.3" depth="2" color="#0044cc" material="emissive: #001144; emissiveIntensity: 0.6"></a-box>

        <!-- Plataforma de descanso -->
        <a-box class="suelo" static-body position="0 29 -82" width="7" height="0.3" depth="5" color="#223355" material="emissive: #112233; emissiveIntensity: 0.4"></a-box>
        <a-text value="TRAMO FINAL" position="0 33 -82" align="center" color="#aaddff" scale="3 3 3"></a-text>

        <!-- Tramo final difícil -->
        <a-box class="suelo" static-body position="-8 32 -90" width="2" height="0.3" depth="2" color="#335577"></a-box>
        <a-box class="suelo" static-body position="8 35 -96" width="2" height="0.3" depth="2" color="#335577"></a-box>
        <a-box class="suelo" static-body position="-5 38 -102" width="2" height="0.3" depth="2" color="#446688"></a-box>

        <!-- Plataforma móvil final -->
        <a-box class="suelo" plataforma-movil="desde: -10 41 -110; hasta: 10 41 -110; velocidad: 0.025"
               static-body width="3.5" height="0.3" depth="3.5" color="#0077ff" material="emissive: #0033aa; emissiveIntensity: 0.8"></a-box>

        <!-- ======================================================
        BLOQUE 10: META FINAL
        Completa la mision y guarda el puntaje acumulado.
        ====================================================== -->
        <!-- META NIVEL 3 / FINAL -->
        <a-entity id="meta3" static-body position="0 46 -125">
            <a-box width="20" height="0.5" depth="20" color="#ffffff" material="emissive: #aaddff; emissiveIntensity: 3"></a-box>
            <a-text value="MISION CUMPLIDA" align="center" position="0 6 0" scale="12 12 12" color="#ffff00"></a-text>
            <a-text value="AGENTE LEGENDARIO" align="center" position="0 3 0" scale="8 8 8" color="#88ccff"></a-text>
            <a-light type="point" intensity="5" color="#ffffff" position="0 8 0"></a-light>
            <a-light type="point" intensity="3" color="#88ccff" position="5 4 5"></a-light>
            <!-- Anillo decorativo giratorio -->
            <a-torus position="0 4 0" radius="6" radius-tubular="0.2" color="#88ccff"
                animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 4000; loop: true; easing: linear"></a-torus>
        </a-entity>

        <!-- ======================================================
        BLOQUE 11: DECORACION AMBIENTAL
        Satelites flotantes que dan profundidad al entorno espacial.
        ====================================================== -->
        <!-- Decoración: satélites flotantes -->
        <a-box position="-20 15 -50" width="1" height="1" depth="3" color="#334466"
            animation="property: rotation; from: 0 0 0; to: 0 360 0; dur: 8000; loop: true; easing: linear"></a-box>
        <a-box position="22 25 -70" width="1" height="1" depth="3" color="#223355"
            animation="property: rotation; from: 0 0 0; to: 360 0 0; dur: 6000; loop: true; easing: linear"></a-box>

        <!-- ======================================================
        BLOQUE 12: JUGADOR
        Avatar con fisica dinamica y componente de gameplay.
        ====================================================== -->
        <!-- JUGADOR (hombre de negro) -->
        <a-entity id="jugador" position="0 3 0" scale="1.5 1.5 1.5" motor-gameplay dynamic-body="mass: 2; fixedRotation: true">
            <!-- Cabeza: piel blanca -->
            <a-cylinder position="0 1.2 0" radius="0.22" height="0.38" color="#f5f0eb">
                <a-sphere position="-0.1 0.1 -0.21" radius="0.03" color="black"></a-sphere>
                <a-sphere position="0.1 0.1 -0.21" radius="0.03" color="black"></a-sphere>
                <a-cylinder position="0 0.28 0" radius="0.28" height="0.04" color="#111111"></a-cylinder>
                <a-cylinder position="0 0.38 0" radius="0.20" height="0.22" color="#111111"></a-cylinder>
            </a-cylinder>
            <!-- Cuerpo: traje negro -->
            <a-box position="0 0.6 0" width="0.7" height="0.75" depth="0.45" color="#111111">
                <a-box position="0 0.05 -0.02" width="0.22" height="0.65" depth="0.46" color="#ffffff"></a-box>
                <a-box position="0 0.05 -0.03" width="0.07" height="0.5" depth="0.46" color="#222222"></a-box>
            </a-box>
            <!-- Brazos -->
            <a-box position="-0.5 0.6 0" width="0.28" height="0.7" depth="0.28" color="#111111" animation="property: rotation; from: -20 0 0; to: 20 0 0; dur: 800; dir: alternate; loop: true">
                <a-box position="0 -0.42 0" width="0.28" height="0.18" depth="0.28" color="#f5f0eb"></a-box>
            </a-box>
            <a-box position="0.5 0.6 0" width="0.28" height="0.7" depth="0.28" color="#111111" animation="property: rotation; from: 20 0 0; to: -20 0 0; dur: 800; dir: alternate; loop: true">
                <a-box position="0 -0.42 0" width="0.28" height="0.18" depth="0.28" color="#f5f0eb"></a-box>
            </a-box>
            <!-- Piernas -->
            <a-box position="-0.2 -0.1 0" width="0.32" height="0.65" depth="0.32" color="#111111"></a-box>
            <a-box position="0.2 -0.1 0" width="0.32" height="0.65" depth="0.32" color="#111111"></a-box>
        </a-entity>

        <!-- ======================================================
        BLOQUE 13: CAMARA
        Sigue al jugador y permite orientar la vista con flechas.
        ====================================================== -->
        <!-- Cámara -->
        <a-entity id="rig-camara" seguimiento-camara>
            <a-camera position="0 7 14" look-controls="enabled: false" wasd-controls="enabled: false"></a-camera>
        </a-entity>

    </a-scene>
    <script src="js/nivel3.init.js"></script>
</body>
</html>
